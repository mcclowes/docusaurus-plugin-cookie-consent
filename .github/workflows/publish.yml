name: Release

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-publish
  cancel-in-progress: false
  queue: max

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Test release state checks
        run: npm run test:release

      - name: Determine version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if already published
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-state.mjs

      - name: Upgrade npm for OIDC support
        if: steps.check.outputs.skip == 'false'
        run: npm install -g npm@11

      - name: Install dependencies
        if: steps.check.outputs.skip == 'false'
        run: npm ci --ignore-scripts

      - name: Build package
        if: steps.check.outputs.skip == 'false'
        run: npm run build

      - name: Run tests
        if: steps.check.outputs.skip == 'false'
        run: npm test

      - name: Create and push tag
        if: steps.check.outputs.skip == 'false'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            if [ "$(git rev-parse "$RELEASE_TAG^{commit}")" != "$(git rev-parse HEAD)" ]; then
              echo "Release tag points to a different commit" >&2
              exit 1
            fi
          else
            git tag "$RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

      - name: Publish to npm with provenance
        if: steps.check.outputs.npm_published == 'false'
        env:
          NPM_RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ "$NPM_RELEASE_VERSION" == *"-alpha"* ]] || [[ "$NPM_RELEASE_VERSION" == *"-beta"* ]] || [[ "$NPM_RELEASE_VERSION" == *"-rc"* ]]; then
            npm publish --provenance --access public --tag next
          else
            npm publish --provenance --access public
          fi

      - name: Create GitHub Release
        if: steps.check.outputs.github_published == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-alpha') || contains(steps.version.outputs.version, '-beta') || contains(steps.version.outputs.version, '-rc') }}
