name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Run tests
        run: npm run test:coverage

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install package dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Pack release artifact
        run: npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"

      - name: Install release artifact in sample site
        working-directory: examples/sample-site
        run: npm install --no-save --package-lock=false "$RUNNER_TEMP/docusaurus-plugin-cookie-consent-$(node -p "require('../../package.json').version").tgz"

      - name: Build sample site
        working-directory: examples/sample-site
        run: npm run build
